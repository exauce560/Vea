<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEA Market - Chargement</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-dark: #0f172a;
      --text-light: #f8fafc;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-light);
      overflow: hidden;
    }

    /* Conteneur principal */
    .app-gateway {
      display: flex;
      flex-direction: column-reverse;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Section Gauche / Bas : Branding & Statut */
    .brand-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo-container {
      margin-bottom: 24px;
      animation: fadeIn 0.6s ease-in-out;
    }

    .app-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .app-subtitle {
      font-size: 1rem;
      color: #cbd5e1;
      max-width: 300px;
    }

    /* Indicateur de chargement */
    .loader-container {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status-text {
      font-size: 0.88rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    /* Section Droite / Arrière-plan mobile : Photo locale */
    .hero-section {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background-color: #000;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 20%, rgba(15, 23, 42, 0.4) 100%);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 768px) {
      .app-gateway {
        flex-direction: row;
      }

      .brand-section {
        flex: 0.9;
      }

      .hero-section {
        position: relative;
        flex: 1;
      }

      .hero-image {
        opacity: 0.9;
      }

      .hero-overlay {
        background: linear-gradient(to left, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.95));
      }

      .app-title {
        font-size: 3.5rem;
      }
    }
  </style>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>

  <div class="app-gateway">
    <!-- Partie Gauche : Branding et Statut -->
    <div class="brand-section">
      <div class="logo-container">
        <h1 class="app-title">VEA MARKET</h1>
        <p class="app-subtitle">Votre expérience shopping simplifiée</p>
      </div>

      <div class="loader-container">
        <div class="spinner"></div>
        <p class="status-text" id="statusText">Vérification de la session...</p>
      </div>
    </div>

    <!-- Partie Droite : Image stockée en local -->
    <div class="hero-section">
      <!-- Mettez l'image téléchargée dans votre projet (ex: img/hero-splash.jpg) -->
      <img
        class="hero-image"
        src="hero-splash.avif"
        alt="Image de présentation VEA Market"
      >
      <div class="hero-overlay"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCY5GYE-TeUEVu6rkYQcwIkELmTM-mPZEc",
      authDomain: "v-ea-fb4c4.firebaseapp.com",
      projectId: "v-ea-fb4c4",
      storageBucket: "v-ea-fb4c4.firebasestorage.app",
      messagingSenderId: "357462139035",
      appId: "1:357462139035:web:7aa2ee50350d88a843a63e"
    };

    const statusText = document.getElementById("statusText");

    // 1. Étape : Vérification dans le LocalStorage
    function checkLocalSession() {
      const localUser = localStorage.getItem("vea_user");

      if (localUser) {
        statusText.textContent = "Connexion locale trouvée...";
        // Utilisateur trouvé localement -> Redirection immédiate
        window.location.href = "acceuil.html";
        return true;
      }
      return false;
    }

    // 2. Étape : Si la vérification locale échoue, on vérifie Firebase
    function checkFirebaseSession() {
      statusText.textContent = "Vérification en ligne...";

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      onAuthStateChanged(auth, (user) => {
        if (user) {
          // Si Firebase trouve l'utilisateur, on enregistre sa session en local pour la prochaine fois
          localStorage.setItem("vea_user", JSON.stringify({ uid: user.uid, email: user.email }));
          window.location.href = "acceuil.html";
        } else {
          // Aucun utilisateur trouvé ni en local ni sur Firebase -> Écran de bienvenue/connexion
          window.location.href = "index1.html";
        }
      });
    }

    // Lancement du processus
    const hasLocalUser = checkLocalSession();
    if (!hasLocalUser) {
      checkFirebaseSession();
    }
  </script>
</body>
</html>
