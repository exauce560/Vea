<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Favoris - Liste d'envies</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="site.webmanifest">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({ appId: "31639645-a285-43ec-9366-175f51dff21c" });
  });
</script>
<style>
:root{--bg:#f3f5fb;--bg2:#e8ecf6;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--blue:#2563eb;--violet:#7c3aed;--teal:#0d9488;--amber:#f59e0b;--rose:#e11d48;--sh:0 4px 18px rgba(30,41,90,.08)}
[data-theme=dark]{--bg:#0b1020;--bg2:#1a2240;--card:#141b30;--tx:#f1f5f9;--mut:#94a3b8;--bd:#25304f;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;letter-spacing:.5px;font-size:1rem}
.ic{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg2);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.ic:active{transform:scale(.92)}.ic svg{width:20px;height:20px}

.hero{background:linear-gradient(120deg,#1d4ed8,#7c3aed 55%,#db2777);color:#fff;padding:26px 16px 70px}
.hero-in{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:1.5rem;font-weight:800}.hero p{opacity:.85;font-size:.9rem;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:1.25rem;font-weight:800;line-height:1.2;word-break:break-word}
.stat span{font-size:.75rem;opacity:.85}

.layout{max-width:1240px;margin:-48px auto 0;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.panel label,.lbl{font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.panel input[type=search],.panel select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:.95rem;outline:none}
.panel input[type=search]:focus,.panel select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;cursor:pointer;text-transform:none!important;letter-spacing:0!important;color:var(--tx)!important}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:7px 13px;border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer}
.chip.on{background:linear-gradient(120deg,var(--blue),var(--violet));color:#fff;border-color:transparent}

.tip{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:14px;font-size:.88rem;font-weight:600;line-height:1.4;background:linear-gradient(120deg,rgba(245,158,11,.16),rgba(245,158,11,.05));border:1px solid rgba(245,158,11,.4);color:var(--tx)}
.tip.info{background:linear-gradient(120deg,rgba(37,99,235,.14),rgba(124,58,237,.06));border-color:rgba(37,99,235,.35)}
.count{font-size:.85rem;font-weight:700;color:var(--mut)}

.grid{display:grid;gap:12px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.thumb{position:relative;width:96px;height:96px;flex:none;border-radius:12px;overflow:hidden;background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card.sold .thumb img{filter:grayscale(.8) brightness(.7)}
.ribbon{position:absolute;inset:auto 6px 6px;background:var(--rose);color:#fff;font-size:.65rem;font-weight:800;text-align:center;padding:3px;border-radius:8px;letter-spacing:.5px}
.heart{position:absolute;top:6px;left:6px;display:flex;align-items:center;gap:3px;background:rgba(15,23,42,.72);color:#fff;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:10px}
.heart svg{width:10px;height:10px;fill:#f43f5e}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.shop{font-size:.72rem;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:8px}
.t-type{background:hsl(var(--h) 85% 92%);color:hsl(var(--h) 60% 28%)}
[data-theme=dark] .t-type{background:hsl(var(--h) 40% 22%);color:hsl(var(--h) 80% 82%)}
.t-boost{background:rgba(124,58,237,.14);color:var(--violet)}.t-liv{background:rgba(13,148,136,.14);color:var(--teal)}
.t-low{background:rgba(245,158,11,.2);color:#b45309}.t-sold{background:rgba(225,29,72,.14);color:var(--rose)}
.price{font-size:1.05rem;font-weight:800;background:linear-gradient(120deg,var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:auto}
.actions{display:flex;gap:8px;align-items:center}
.wa{flex:1;text-align:center;background:#16a34a;color:#fff;font-size:.78rem;font-weight:700;padding:8px 10px;border-radius:10px;transition:filter .2s}
.wa:hover{filter:brightness(1.1)}.wa.alt{background:var(--bg2);color:var(--tx)}
.rm{width:36px;height:36px;border:none;border-radius:10px;background:var(--bg2);color:var(--mut);cursor:pointer;display:grid;place-items:center;flex:none}
.rm:hover{background:rgba(225,29,72,.14);color:var(--rose)}.rm svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}

.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--mut);background:var(--card);border:1px dashed var(--bd);border-radius:18px}
.empty svg{width:54px;height:54px;stroke:var(--violet);fill:none;stroke-width:1.5;margin-bottom:10px}
.empty p{margin-bottom:16px;font-size:.95rem}
.cta{display:inline-block;background:linear-gradient(120deg,var(--blue),var(--violet));color:#fff;font-weight:700;padding:11px 22px;border-radius:12px}
.sk{height:116px;background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,150%);background:#1e293b;color:#fff;padding:11px 16px;border-radius:14px;font-size:.88rem;font-weight:600;display:flex;gap:14px;align-items:center;z-index:99;transition:transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.show{transform:translate(-50%,0)}.toast button{background:none;border:none;color:#a5b4fc;font-weight:800;cursor:pointer;font-size:.88rem}

@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){
  .top{padding:14px 32px}.hero{padding:44px 32px 90px}.hero h1{font-size:2.1rem}
  .hero-in{flex-direction:row;justify-content:space-between;align-items:flex-end}.stats{min-width:560px}
  .stat b{font-size:1.5rem}
  .layout{flex-direction:row;align-items:flex-start;gap:28px;padding:0 32px 60px;margin-top:-58px}
  .side{width:290px;flex:none;position:sticky;top:84px}
  .panel{padding:20px;gap:12px}.chips{flex-wrap:wrap;overflow:visible}
  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .card{flex-direction:column;padding:0;overflow:hidden;border-radius:20px}
  .card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(37,99,235,.18)}
  .card:hover .thumb img{transform:scale(1.07)}
  .thumb{width:100%;height:210px;border-radius:0}
  .info{padding:14px 16px 16px;gap:6px}.title{font-size:1.02rem}.price{font-size:1.2rem}
  .toast{left:auto;right:28px;transform:translate(0,150%)}.toast.show{transform:none}
}
</style>
</head>
<body>
<header class="top">
  <button class="ic" id="back" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
  <span class="brand">MES FAVORIS</span>
  <button class="ic" id="theme" aria-label="Changer le thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<section class="hero"><div class="hero-in">
  <div><h1>Ma liste d'envies</h1><p id="heroSub">Chargement de vos favoris...</p></div>
  <div class="stats" id="stats"></div>
</div></section>

<div class="layout">
  <aside class="side"><div class="panel">
    <input type="search" id="q" placeholder="Rechercher dans mes favoris">
    <label for="sort">Trier par</label>
    <select id="sort">
      <option value="recent">Ajoutés récemment</option>
      <option value="asc">Prix croissant</option>
      <option value="desc">Prix décroissant</option>
      <option value="pop">Les plus aimés</option>
    </select>
    <label class="chk"><input type="checkbox" id="hideSold"> Masquer les articles vendus</label>
    <div class="lbl">Catégories</div>
    <div class="chips" id="chips"></div>
  </div></aside>
  <main>
    <div class="tip hidden" id="tip"></div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, arrayRemove, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCY5GYE-TeUEVu6rkYQcwIkELmTM-mPZEc", authDomain: "v-ea-fb4c4.firebaseapp.com",
  projectId: "v-ea-fb4c4", storageBucket: "v-ea-fb4c4.firebasestorage.app",
  messagingSenderId: "357462139035", appId: "1:357462139035:web:7aa2ee50350d88a843a63e", measurementId: "G-WEG1X65STP"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const DOC_ROOT = `projects/${firebaseConfig.projectId}/databases/(default)/documents`;
const COLS = ["acheteurs", "vendeurs", "vendeurs_clients"];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const sv = (f) => f?.stringValue || "";
const localFavs = () => { try { return JSON.parse(localStorage.getItem("userFavorites") || "[]"); } catch (_) { return []; } };
const localSave = (a) => { try { localStorage.setItem("userFavorites", JSON.stringify(a)); } catch (_) {} };

let items = [], user = null, curCol = null;
const state = { q: "", sort: "recent", type: "all", hideSold: false };

// Thème (même clé que les autres pages)
const setTheme = (t) => { document.documentElement.dataset.theme = t; localStorage.setItem("app_theme", t); };
document.documentElement.dataset.theme = localStorage.getItem("app_theme") === "dark" ? "dark" : "light";
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("back").onclick = () => (window.location.href = "acceuil.html");

// Lecture Firestore par REST avec masque : on évite les photos en base64, très lourdes
async function batchGet(paths, fields) {
  const jeton = await auth.currentUser.getIdToken();
  const r = await fetch(`https://firestore.googleapis.com/v1/${DOC_ROOT}:batchGet`, {
    method: "POST",
    headers: { Authorization: "Bearer " + jeton, "Content-Type": "application/json" },
    body: JSON.stringify({ documents: paths.map((p) => `${DOC_ROOT}/${p}`), mask: { fieldPaths: fields } })
  });
  if (!r.ok) throw new Error("batchGet " + r.status);
  return (await r.json()).filter((x) => x.found).map((x) => ({ path: x.found.name.split("/documents/")[1], f: x.found.fields || {} }));
}

onAuthStateChanged(auth, async (u) => {
  user = u;
  if (!u) {
    const ids = localFavs();
    return ids.length ? charger(ids) : vide("Connectez-vous pour retrouver vos favoris.", "verification.html", "Se connecter");
  }
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async (OneSignal) => { try { await OneSignal.login(u.uid); } catch (_) {} });

  let ids = [];
  try {
    const trouves = await batchGet(COLS.map((c) => `${c}/${u.uid}`), ["favoris"]);
    trouves.sort((a, b) => COLS.indexOf(a.path.split("/")[0]) - COLS.indexOf(b.path.split("/")[0]));
    if (trouves.length) {
      curCol = trouves[0].path.split("/")[0];
      ids = (trouves[0].f.favoris?.arrayValue?.values || []).map((v) => v.stringValue);
    }
  } catch (e) { console.error("Erreur favoris :", e); }
  if (!ids.length) ids = localFavs();
  if (!ids.length) return vide("Votre liste est vide. Touchez le cœur d'un article pour le retrouver ici.", "acceuil.html", "Découvrir des articles");
  charger(ids);
});

async function charger(ids) {
  // Articles lus en parallèle (avant : un par un)
  const snaps = await Promise.all(ids.map((id) => getDoc(doc(db, "produits", id)).catch(() => null)));
  const prods = [];
  snaps.forEach((s, i) => { if (s && s.exists()) prods.push({ id: s.id, order: i, d: s.data() }); });

  // Boutiques lues une seule fois chacune
  const shops = {};
  const vids = [...new Set(prods.map((p) => p.d.vendeurId).filter(Boolean))];
  if (vids.length && auth.currentUser) {
    try {
      for (let i = 0; i < vids.length; i += 40) {
        const lot = vids.slice(i, i + 40);
        const found = await batchGet(lot.flatMap((v) => [`vendeurs/${v}`, `vendeurs_clients/${v}`]), ["shopName", "nomBoutique", "nom", "whatsapp", "telephone"]);
        found.forEach((x) => {
          const id = x.path.split("/")[1];
          if (shops[id] && !x.path.startsWith("vendeurs/")) return;
          shops[id] = { name: sv(x.f.shopName) || sv(x.f.nomBoutique) || sv(x.f.nom), wa: (sv(x.f.whatsapp) || sv(x.f.telephone)).replace(/\D/g, "") };
        });
      }
    } catch (e) { console.error("Erreur boutiques :", e); }
  }

  const now = Date.now();
  items = prods.map(({ id, order, d }) => {
    const s = shops[d.vendeurId] || {};
    const stock = d.stock === undefined ? NaN : Number(d.stock);
    const fav = Array.isArray(d.favoris) ? d.favoris.length : Number(d.favoris ?? d.favorisCount ?? d.likes ?? 0) || 0;
    const fin = d.boostUntil ? (d.boostUntil.toMillis ? d.boostUntil.toMillis() : new Date(d.boostUntil).getTime()) : 0;
    return {
      id, order, fav, stock, vendeurId: d.vendeurId || "",
      nom: d.nom || d.title || d.name || "Article",
      prix: Number(d.prix ?? d.price) || 0, devise: d.devise || d.currency || "FCFA",
      img: d.image || d.imageUrl || (Array.isArray(d.images) && d.images[0]) || d.photo || "https://via.placeholder.com/300",
      type: d.type || "", livraison: d.livraison === true,
      sold: d.vendu === true || d.statut === "vendu" || (Number.isFinite(stock) && stock <= 0),
      boosted: d.isBoosted === true && fin > now,
      shop: d.shopName || d.vendeurNom || d.nomBoutique || s.name || "Boutique", wa: s.wa || ""
    };
  });

  if (!items.length) return vide("Aucun article valide dans vos favoris.", "acceuil.html", "Découvrir des articles");
  rafraichir();
}

const hue = (t) => [...t].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);

function carte(p) {
  const tags = [
    p.type && `<span class="tag t-type" style="--h:${hue(p.type)}">${esc(p.type)}</span>`,
    p.sold && `<span class="tag t-sold">Vendu</span>`,
    !p.sold && p.stock === 1 && `<span class="tag t-low">Dernier en stock</span>`,
    !p.sold && p.stock > 1 && p.stock <= 3 && `<span class="tag t-low">Plus que ${p.stock}</span>`,
    p.boosted && `<span class="tag t-boost">Sponsorisé</span>`,
    p.livraison && `<span class="tag t-liv">Livraison</span>`
  ].filter(Boolean).join("");
  const lien = `article.html?id=${encodeURIComponent(p.id)}`;
  const msg = encodeURIComponent(`Bonjour, je suis intéressé(e) par « ${p.nom} » sur VÉA Market.`);
  const bouton = !p.sold && p.wa.length >= 8
    ? `<a class="wa" href="https://wa.me/${p.wa}?text=${msg}" target="_blank" rel="noopener">Contacter</a>`
    : `<a class="wa alt" href="${lien}">${p.sold ? "Voir l'article" : "Voir"}</a>`;
  return `<article class="card ${p.sold ? "sold" : ""}">
    <a class="thumb" href="${lien}"><img src="${esc(p.img)}" alt="${esc(p.nom)}" loading="lazy">
      <span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>${p.fav}</span>
      ${p.sold ? '<span class="ribbon">VENDU</span>' : ""}</a>
    <div class="info">
      <span class="shop">${esc(p.shop)}</span>
      <a class="title" href="${lien}">${esc(p.nom)}</a>
      <div class="tags">${tags}</div>
      <div class="price">${p.prix ? `${esc(p.prix)} ${esc(p.devise)}` : "Prix non spécifié"}</div>
      <div class="actions">${bouton}
        <button class="rm" data-rm="${esc(p.id)}" title="Retirer des favoris" aria-label="Retirer des favoris"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div></div></article>`;
}

function filtrer() {
  const q = norm(state.q);
  const l = items.filter((p) =>
    (!state.hideSold || !p.sold) && (state.type === "all" || p.type === state.type) &&
    (!q || norm(`${p.nom} ${p.shop} ${p.type}`).includes(q)));
  const tri = { recent: (a, b) => b.order - a.order, asc: (a, b) => a.prix - b.prix, desc: (a, b) => b.prix - a.prix, pop: (a, b) => b.fav - a.fav };
  return l.sort(tri[state.sort]);
}

function rafraichir() {
  const dispo = items.filter((p) => !p.sold);
  const total = {};
  dispo.forEach((p) => { if (p.prix) total[p.devise] = (total[p.devise] || 0) + p.prix; });
  const valeur = Object.entries(total).map(([d, v]) => `${+v.toFixed(2)} ${d}`).join(" + ") || "—";
  const nbShops = new Set(items.map((p) => p.vendeurId).filter(Boolean)).size;
  $("stats").innerHTML = [["Articles", items.length], ["Disponibles", dispo.length], ["Boutiques", nbShops], ["Valeur totale", valeur]]
    .map(([l, v]) => `<div class="stat"><b>${esc(v)}</b><span>${l}</span></div>`).join("");
  $("heroSub").textContent = items.length ? `${items.length} article(s) enregistré(s) dans votre liste.` : "Votre liste est vide.";

  // Conseil du moment
  const bas = dispo.filter((p) => Number.isFinite(p.stock) && p.stock <= 1).length;
  const vendus = items.length - dispo.length;
  const tip = $("tip");
  tip.className = "tip";
  if (!items.length) tip.classList.add("hidden");
  else if (bas) tip.textContent = `⚡ ${bas} article(s) bientôt épuisé(s). Contactez le vendeur avant qu'il ne parte.`;
  else if (vendus) { tip.textContent = `ℹ️ ${vendus} article(s) vendu(s) dans votre liste. Masquez-les ou retirez-les pour la garder à jour.`; tip.classList.add("info"); }
  else { tip.textContent = "💡 Astuce : touchez « Contacter » pour négocier directement avec le vendeur sur WhatsApp."; tip.classList.add("info"); }

  // Catégories
  const types = [...new Set(items.map((p) => p.type).filter(Boolean))];
  if (state.type !== "all" && !types.includes(state.type)) state.type = "all";
  $("chips").innerHTML = ["all", ...types].map((t) => `<button class="chip ${state.type === t ? "on" : ""}" data-t="${esc(t)}">${t === "all" ? "Tous" : esc(t)}</button>`).join("");

  const liste = filtrer();
  $("count").textContent = liste.length === items.length ? `${liste.length} article(s)` : `${liste.length} sur ${items.length} article(s)`;
  $("grid").innerHTML = liste.length ? liste.map(carte).join("") : items.length
    ? `<div class="empty"><p>Aucun favori ne correspond à votre recherche.</p></div>`
    : "";
  if (!items.length) vide("Votre liste de favoris est vide.", "acceuil.html", "Découvrir des articles");
}

function vide(msg, href, texte) {
  $("stats").innerHTML = ""; $("count").textContent = ""; $("tip").classList.add("hidden");
  $("heroSub").textContent = "0 article enregistré";
  $("grid").innerHTML = `<div class="empty"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><p>${esc(msg)}</p><a class="cta" href="${href}">${esc(texte)}</a></div>`;
}

// Retirer avec possibilité d'annuler
let toastTimer;
function toast(msg, annuler) {
  const t = $("toast");
  t.innerHTML = `<span>${esc(msg)}</span>${annuler ? "<button>Annuler</button>" : ""}`;
  if (annuler) t.querySelector("button").onclick = () => { annuler(); t.classList.remove("show"); };
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 5000);
}

function retirer(id) {
  const i = items.findIndex((p) => p.id === id);
  if (i < 0) return;
  const [p] = items.splice(i, 1);
  localSave(localFavs().filter((x) => x !== id));
  rafraichir();
  if (user && curCol) updateDoc(doc(db, curCol, user.uid), { favoris: arrayRemove(id) }).catch(console.error);
  toast("Article retiré de vos favoris", () => {
    items.push(p); items.sort((a, b) => a.order - b.order);
    localSave([...new Set([...localFavs(), id])]);
    rafraichir();
    if (user && curCol) updateDoc(doc(db, curCol, user.uid), { favoris: arrayUnion(id) }).catch(console.error);
  });
}

$("grid").addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) retirer(b.dataset.rm); });
$("chips").addEventListener("click", (e) => { const b = e.target.closest("[data-t]"); if (b) { state.type = b.dataset.t; rafraichir(); } });
$("q").addEventListener("input", (e) => { state.q = e.target.value; rafraichir(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; rafraichir(); });
$("hideSold").addEventListener("change", (e) => { state.hideSold = e.target.checked; rafraichir(); });
</script>
