<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable - Vea Market</title>
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent: #0284c7;
      --accent-dark: #0369a1;
      --accent-soft: #e0f2fe;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }
    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
      --accent-dark: #0ea5e9;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    main {
      width: 100%;
      max-width: 400px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 36px 26px 30px;
      box-shadow: var(--shadow);
    }
    .icone {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
    }
    .icone svg { width: 42px; height: 42px; }
    .code {
      font-size: 4.2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--accent);
    }
    h1 { font-size: 1.3rem; font-weight: 800; margin: 12px 0 8px; }
    p { font-size: 0.95rem; line-height: 1.5; color: var(--text-muted); margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible, .lien:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .lien {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
    }
    .lien:hover { color: var(--accent); }
    .marque { margin-top: 22px; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
    .marque span { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="icone" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <path d="M3 6h18"></path>
        <path d="M9.5 10.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5"></path>
        <path d="M12 17.5h.01"></path>
      </svg>
    </div>
    <div class="code">404</div>
    <h1 id="titre">Page introuvable</h1>
    <p id="texte">Oups, cette page n'existe pas ou a été déplacée. Retournez voir les derniers articles de Vea Market.</p>
    <a class="btn" id="btnAccueil" href="/index.html">Retour à l'accueil</a>
    <a class="lien" id="lienSite" href="/">Page d'accueil du site</a>
    <div class="marque"><span>Vea</span> Market © 2026</div>
  </main>

  <script>
    // Même thème et même langue que l'application
    (function () {
      var theme = "light", lang = "fr";
      try {
        theme = localStorage.getItem("app_theme") ||
          (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        lang = localStorage.getItem("app_lang") || (navigator.language || "fr").slice(0, 2);
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");

      if (lang === "en") {
        document.documentElement.lang = "en";
        document.title = "Page not found - Vea Market";
        document.getElementById("titre").textContent = "Page not found";
        document.getElementById("texte").textContent = "Oops, this page doesn't exist or has been moved. Go back and see the latest items on Vea Market.";
        document.getElementById("btnAccueil").textContent = "Back to home";
        document.getElementById("lienSite").textContent = "Website home page";
      }
    })();
  </script>
</body>
</html>
